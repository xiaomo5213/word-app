<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>自考英语专升本 · 带背单词</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; -webkit-tap-highlight-color: transparent; }

  body {
    background: #f3f6fc;
    margin: 0;
    padding: 24px 16px;
    display: flex;
    justify-content: center;
    /* 微信端防止下拉页面时整页弹动 */
    overscroll-behavior-y: contain;
  }

  .app {
    max-width: 1300px;
    width: 100%;
    background: white;
    border-radius: 32px;
    box-shadow: 0 20px 40px rgba(0, 20, 40, 0.08);
    padding: 28px 30px 30px;
  }

  h1 { font-size: 1.9rem; font-weight: 600; color: #0b2a4a; margin: 0 0 8px; }

  .subhead {
    color: #4a627a;
    margin-bottom: 20px;
    font-size: 0.95rem;
    border-left: 4px solid #2b7be4;
    padding: 10px 16px;
    background: #eef5ff;
    border-radius: 0 12px 12px 0;
    line-height: 1.5;
  }

  /* ============ 工具栏 ============ */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 24px;
    margin-bottom: 22px;
    padding: 0 4px 10px;
    border-bottom: 1px solid #e5eef8;
  }

  .toolbar label { font-size: 0.9rem; color: #557091; margin-right: 6px; }

  .toolbar select {
    border: none;
    background: transparent;
    font-size: 0.95rem;
    font-weight: 600;
    color: #0b2a4a;
    padding: 4px 6px;
    cursor: pointer;
    outline: none;
    border-bottom: 1.5px dashed #b9cde4;
  }

  .toolbar select:hover { border-bottom-color: #2b7be4; }

  .order-btn {
    border: none;
    background: transparent;
    font-size: 0.95rem;
    font-weight: 600;
    color: #0b2a4a;
    cursor: pointer;
    padding: 4px 6px;
    border-bottom: 1.5px dashed #b9cde4;
    transition: 0.15s;
  }

  .order-btn:hover { color: #2b7be4; border-bottom-color: #2b7be4; }

  .stats { margin-left: auto; color: #557091; font-size: 0.88rem; white-space: nowrap; }

  /* ============ 单词卡片 (桌面端: 音标在单词下方) ============ */
  .word-list { display: flex; flex-direction: column; gap: 14px; margin: 18px 0; }

  .word-card {
    display: grid;
    grid-template-columns: 200px 1fr 300px 44px;
    align-items: start;
    background: #ffffff;
    border-radius: 22px;
    border: 1px solid #deeaf6;
    padding: 14px 18px;
    gap: 10px;
    transition: 0.15s;
    position: relative;
  }

  .word-card:hover {
    border-color: #b4d0f0;
    box-shadow: 0 4px 12px rgba(43, 123, 228, 0.08);
  }

  /* 桌面端：单词 + 音标 竖直排列 */
  .word-en {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    cursor: pointer;
    user-select: none;
  }

  /* 第一行: 单词 + 发音按钮 */
  .word-en .en-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.35rem;
    font-weight: 600;
    color: #0b2a4a;
    transition: 0.15s;
    line-height: 1.2;
  }

  .word-en:hover .en-line { color: #1a62c4; text-decoration: underline; }

  .speaker-icon { font-size: 1rem; opacity: 0.55; }
  .word-en:hover .speaker-icon { opacity: 1; }

  /* 第二行: 音标 */
  .word-phonetic {
    font-size: 0.85rem;
    color: #607e9e;
    font-weight: 400;
    font-family: 'Courier New', monospace;
    line-height: 1.3;
  }

  .word-meaning {
    color: #25496d;
    font-size: 0.95rem;
    line-height: 1.55;
    padding-right: 12px;
    border-right: 1px dashed #c8d9ed;
  }

  .word-example {
    display: block;
    margin-top: 6px;
    font-size: 0.82rem;
    color: #7a8fa8;
    line-height: 1.5;
    font-style: italic;
  }

  .dictation-area { display: flex; align-items: center; }

  .dictation-input {
    width: 100%;
    max-width: 220px;
    padding: 10px 14px;
    border-radius: 14px;
    border: 1.5px solid #c2d6ed;
    font-size: 0.98rem;
    font-weight: 500;
    color: #0b2a4a;
    background: #fafdff;
    outline: none;
    letter-spacing: 0.3px;
    transition: 0.15s;
  }

  .dictation-input:focus {
    border-color: #2b7be4;
    box-shadow: 0 0 0 3px rgba(43, 123, 228, 0.1);
    background: #fff;
  }

  .dictation-input.correct {
    border-color: #2e9e5b;
    background: #e9f9ef;
    color: #1c6d3e;
    font-weight: 600;
  }

  .dictation-input.wrong {
    border-color: #d84c4c;
    background: #ffecec;
    color: #b32b2b;
    text-decoration: line-through 2px #d84c4c;
  }

  .remove-btn {
    align-self: center;
    justify-self: center;
    border: none;
    background: transparent;
    color: #b7c7d9;
    font-size: 1.15rem;
    cursor: pointer;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
  }

  .remove-btn:hover { background: #ffecec; color: #d84c4c; }

  /* ============ 分页 (桌面端) ============ */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid #e5eef8;
  }

  .page-btn {
    background: white;
    border: 1px solid #c2d6ed;
    border-radius: 40px;
    padding: 9px 26px;
    font-size: 0.95rem;
    font-weight: 500;
    color: #1f3a5f;
    cursor: pointer;
    transition: 0.15s;
  }

  .page-btn:hover:not(:disabled) { background: #e6f0fd; border-color: #2b7be4; }
  .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .page-indicator {
    font-size: 0.95rem;
    color: #25496d;
    font-weight: 500;
    background: #eef5ff;
    padding: 8px 20px;
    border-radius: 40px;
  }

  .empty-state, .loading-state {
    text-align: center;
    padding: 60px 20px;
    color: #607e9e;
    background: #f9fcff;
    border-radius: 24px;
    border: 1px dashed #b8cee6;
  }

  /* ============ 弹窗 ============ */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(10, 30, 60, 0.45);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
  }

  .modal-mask.show { display: flex; }

  .modal {
    background: #fff;
    max-width: 560px;
    width: 100%;
    max-height: 82vh;
    overflow-y: auto;
    border-radius: 24px;
    padding: 26px 28px 20px;
    box-shadow: 0 30px 60px rgba(0, 20, 50, 0.25);
    position: relative;
    animation: pop 0.2s ease-out;
    -webkit-overflow-scrolling: touch;
  }

  @keyframes pop { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 16px;
    border: none;
    background: #f1f5fa;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 1.1rem;
    color: #607e9e;
    cursor: pointer;
    transition: 0.15s;
  }

  .modal-close:hover { background: #e1eaf5; color: #0b2a4a; }

  .modal-word {
    font-size: 2rem;
    font-weight: 700;
    color: #0b2a4a;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .modal-word .modal-speak { font-size: 1.2rem; cursor: pointer; opacity: 0.6; }
  .modal-word .modal-speak:hover { opacity: 1; }

  .modal-phonetic {
    color: #557091;
    font-size: 0.95rem;
    font-family: 'Courier New', monospace;
    margin-bottom: 16px;
  }

  .modal-section-title {
    font-size: 0.82rem;
    font-weight: 700;
    color: #2b7be4;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 18px 0 8px;
  }

  .modal-meaning { font-size: 1rem; color: #1f3a5f; line-height: 1.7; }

  .modal-example {
    font-size: 0.92rem;
    color: #557091;
    line-height: 1.65;
    background: #f7fafd;
    padding: 10px 14px;
    border-radius: 12px;
    border-left: 3px solid #b4d0f0;
  }

  .modal-source {
    margin-top: 22px;
    padding-top: 14px;
    border-top: 1px dashed #d9e6f2;
    font-size: 0.78rem;
    color: #8fa6bd;
    line-height: 1.5;
  }

  /* ================= 移动端 & 微信端适配 ================= */
  @media (max-width: 780px) {
    body {
      padding: 0;
      background: #f3f6fc;
      align-items: stretch;
    }

    .app {
      padding: 16px 12px calc(20px + env(safe-area-inset-bottom, 0px));
      border-radius: 0;
      box-shadow: none;
      max-width: 100%;
    }

    h1 { font-size: 1.35rem; margin-top: 4px; }

    .subhead {
      font-size: 0.82rem;
      padding: 8px 12px;
      margin-bottom: 14px;
      line-height: 1.45;
    }

    .toolbar {
      gap: 12px;
      padding: 0 2px 8px;
      margin-bottom: 14px;
      font-size: 0.9rem;
    }

    .toolbar label,
    .toolbar select,
    .order-btn,
    .stats { font-size: 0.88rem; }

    .stats { margin-left: 0; width: 100%; text-align: left; order: 3; }

    /* 手机端卡片: 单词 + 音标 在同一行 */
    .word-card {
      grid-template-columns: 1fr 44px;
      grid-template-areas:
        "en remove"
        "meaning meaning"
        "input input";
      gap: 10px;
      padding: 14px;
    }

    .word-en {
      grid-area: en;
      flex-direction: row;      /* 手机端: 单词与音标 横排 */
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
    }

    .word-en .en-line { font-size: 1.22rem; }

    .word-phonetic { font-size: 0.82rem; }

    .word-meaning {
      grid-area: meaning;
      border-right: none;
      padding-right: 0;
      font-size: 0.92rem;
    }

    .dictation-area { grid-area: input; }

    .dictation-input {
      max-width: 100%;
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem; /* 16px+ 防止 iOS 自动缩放 */
    }

    .remove-btn {
      grid-area: remove;
      align-self: start;
      justify-self: end;
    }

    /* 手机端分页: 大按钮, 方便拇指 */
    .pagination {
      gap: 10px;
      padding-top: 16px;
      margin-top: 18px;
      flex-wrap: nowrap;
    }

    .page-btn {
      flex: 1 1 0;
      min-width: 0;
      padding: 14px 10px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 16px;
      text-align: center;
      white-space: nowrap;
    }

    .page-indicator {
      flex: 0 0 auto;
      padding: 12px 16px;
      font-size: 0.92rem;
      border-radius: 16px;
    }

    /* 弹窗: 底部抽屉式 */
    .modal-mask { padding: 0; align-items: flex-end; }

    .modal {
      max-width: 100%;
      width: 100%;
      max-height: 88vh;
      border-radius: 22px 22px 0 0;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-word { font-size: 1.7rem; }
    .modal-close { top: 12px; right: 14px; }
  }

  /* 极小屏 (iPhone SE 等) */
  @media (max-width: 380px) {
    .word-en .en-line { font-size: 1.1rem; }
    .word-phonetic { font-size: 0.78rem; }
    .page-btn { padding: 13px 6px; font-size: 0.92rem; }
    .page-indicator { font-size: 0.85rem; padding: 10px 12px; }
  }
</style>
</head>
<body>

<div class="app">
  <h1>📘 自考英语专升本 · 带背单词</h1>
  <div class="subhead">
    ⚡ 点单词看释义 · 点 🔊 听发音 · 默写一致绿色 / 不一致红色 · 点 ✕ 移除
  </div>

  <div class="toolbar">
    <div>
      <label for="pageSizeSelect">每页</label>
      <select id="pageSizeSelect">
        <option value="20">20</option>
        <option value="50" selected>50</option>
        <option value="60">60</option>
        <option value="80">80</option>
        <option value="100">100</option>
      </select>
      <span style="margin-left:4px;color:#557091;font-size:0.9rem;">词</span>
    </div>

    <button id="orderBtn" class="order-btn">正序</button>

    <span class="stats" id="statsDisplay">加载中…</span>
  </div>

  <div id="wordListContainer" class="word-list">
    <div class="loading-state">正在加载单词数据…</div>
  </div>

  <div class="pagination">
    <button id="prevBtn" class="page-btn" disabled>← 上一页</button>
    <span class="page-indicator" id="pageIndicator">- / -</span>
    <button id="nextBtn" class="page-btn" disabled>下一页 →</button>
  </div>
</div>

<!-- ============ 弹窗 ============ -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox">
    <button class="modal-close" id="modalClose">✕</button>
    <h2 class="modal-word" id="modalWord"></h2>
    <div class="modal-phonetic" id="modalPhonetic"></div>

    <div class="modal-section-title">释义</div>
    <div class="modal-meaning" id="modalMeaning"></div>

    <div class="modal-section-title" id="modalExampleTitle" style="display:none;">例句</div>
    <div class="modal-example" id="modalExample" style="display:none;"></div>

    <div class="modal-source">
      内容部分来源于互联网：维基词典 (CC BY-SA 3.0)、GitHub 开源词典、WordNet、谷歌翻译、百度翻译、有道词典。
    </div>
  </div>
</div>

<script>
// ==================== 全局状态 ====================
let rawWords = [];
let currentPage = 1;
let pageSize = 50;
let isSequential = true;
let orderedWords = [];

const REMOVED_KEY = 'wordapp_removed_words';
let removedSet = new Set();

const wordListEl = document.getElementById('wordListContainer');
const pageSizeSelect = document.getElementById('pageSizeSelect');
const orderBtn = document.getElementById('orderBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pageIndicator = document.getElementById('pageIndicator');
const statsDisplay = document.getElementById('statsDisplay');

const modalMask = document.getElementById('modalMask');
const modalClose = document.getElementById('modalClose');
const modalWord = document.getElementById('modalWord');
const modalPhonetic = document.getElementById('modalPhonetic');
const modalMeaning = document.getElementById('modalMeaning');
const modalExample = document.getElementById('modalExample');
const modalExampleTitle = document.getElementById('modalExampleTitle');

// ==================== 工具函数 ====================
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function wordKey(en) { return (en || '').trim().toLowerCase(); }

function loadRemoved() {
  try {
    const raw = localStorage.getItem(REMOVED_KEY);
    if (raw) removedSet = new Set(JSON.parse(raw));
  } catch (e) { console.warn('读取已移除单词失败', e); }
}

function saveRemoved() {
  try {
    localStorage.setItem(REMOVED_KEY, JSON.stringify([...removedSet]));
  } catch (e) { console.warn('保存已移除单词失败', e); }
}

function rebuildOrderedWords() {
  const visible = rawWords.filter(w => {
    const en = w.en || w.英文 || '';
    return !removedSet.has(wordKey(en));
  });
  orderedWords = isSequential ? visible : shuffleArray(visible);
}

function getPageWords() {
  const start = (currentPage - 1) * pageSize;
  return orderedWords.slice(start, start + pageSize);
}

function getTotalPages() {
  return Math.ceil(orderedWords.length / pageSize) || 1;
}

function updatePagination() {
  const totalPages = getTotalPages();
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  pageIndicator.textContent = `${currentPage} / ${totalPages}`;
  prevBtn.disabled = currentPage <= 1;
  nextBtn.disabled = currentPage >= totalPages;

  if (orderedWords.length === 0) {
    statsDisplay.textContent = '暂无单词（可能都被移除了）';
    return;
  }
  const startIdx = (currentPage - 1) * pageSize + 1;
  const endIdx = Math.min(currentPage * pageSize, orderedWords.length);
  statsDisplay.textContent = `共 ${orderedWords.length} 词 · 第 ${currentPage}/${totalPages} 页 · 显示 ${startIdx}-${endIdx}`;
}

// ==================== 发音 (兼容微信) ====================
let _audioEl = null; // 复用 audio 元素，避免多次 new 引起 iOS 拒绝播放

function speakWord(word) {
  if (!word) return;

  // 方式 1: 浏览器原生 SpeechSynthesis (桌面 Chrome / Edge / Safari 效果好)
  // 微信内置浏览器 (X5/QQ Browser) 对 speechSynthesis 支持不稳定，可能静默失败
  const isWeChat = /micromessenger/i.test(navigator.userAgent);
  const isAndroid = /android/i.test(navigator.userAgent);
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  // 微信 + 安卓: speechSynthesis 大多不可用，直接走在线 TTS
  if (isWeChat && isAndroid) {
    playOnlineTTS(word);
    return;
  }

  // 其它情况先试 speechSynthesis，2 秒后若无声音回退
  if (window.speechSynthesis) {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = 'en-US';
      u.rate = 0.9;
      u.volume = 1;

      let spoke = false;
      u.onstart = () => { spoke = true; };
      u.onend = () => { spoke = true; };

      window.speechSynthesis.speak(u);

      // iOS Safari 有时会静默失败, 1500ms 后如果还没 onstart 就走在线 TTS
      if (isIOS || isWeChat) {
        setTimeout(() => {
          if (!spoke) playOnlineTTS(word);
        }, 1500);
      }
      return;
    } catch (e) {
      console.warn('speechSynthesis 失败, 回退到在线 TTS', e);
    }
  }

  playOnlineTTS(word);
}

// 在线 TTS (有道发音, 无需 key, 支持 https)
function playOnlineTTS(word) {
  try {
    // 有道词典发音接口 (英式), 也可用 type=2 美式
    const url = 'https://dict.youdao.com/dictvoice?audio=' +
                encodeURIComponent(word) + '&type=2';

    if (!_audioEl) {
      _audioEl = new Audio();
      _audioEl.preload = 'auto';
    }
    _audioEl.src = url;
    _audioEl.currentTime = 0;
    const p = _audioEl.play();
    if (p && p.catch) {
      p.catch(err => {
        console.warn('在线发音播放失败:', err);
        // 最后兜底: 用系统 TTS 再试一次
        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(word);
          u.lang = 'en-US';
          window.speechSynthesis.speak(u);
        }
      });
    }
  } catch (e) {
    console.warn('playOnlineTTS 异常', e);
  }
}

// ==================== 弹窗 ====================
function openModal(word) {
  const en = word.en || word.英文 || '';
  const phonetic = word.phonetic || word.音标 || '';
  const meaning = word.meaning || word.中文 || '';
  const example = word.example || word.例句 || word.自考例句 || '';

  modalWord.innerHTML = `${escapeHtml(en)} <span class="modal-speak" title="发音">🔊</span>`;
  modalWord.querySelector('.modal-speak').addEventListener('click', () => speakWord(en));

  modalPhonetic.textContent = phonetic;
  modalMeaning.innerHTML = escapeHtml(meaning).replace(/<br\s*\/?>/gi, '<br>').replace(/\n/g, '<br>');

  if (example) {
    modalExampleTitle.style.display = 'block';
    modalExample.style.display = 'block';
    modalExample.textContent = example;
  } else {
    modalExampleTitle.style.display = 'none';
    modalExample.style.display = 'none';
  }

  modalMask.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modalMask.classList.remove('show');
  document.body.style.overflow = '';
}

modalClose.addEventListener('click', closeModal);
modalMask.addEventListener('click', (e) => { if (e.target === modalMask) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// ==================== 渲染 ====================
function renderPage() {
  const pageWords = getPageWords();

  if (!pageWords.length) {
    wordListEl.innerHTML = `<div class="empty-state">📭 没有单词可显示<br><small>（可能都被你移除了）</small></div>`;
    updatePagination();
    return;
  }

  let html = '';
  pageWords.forEach((word, idx) => {
    const en = word.en || word.英文 || '';
    const phonetic = word.phonetic || word.音标 || '';
    const meaning = word.meaning || word.中文 || '';
    const example = word.example || word.例句 || word.自考例句 || '';

    const safeEn = escapeHtml(en);
    const safePhonetic = escapeHtml(phonetic);
    const safeMeaning = escapeHtml(meaning).replace(/<br\s*\/?>/gi, ' ').replace(/\n/g, ' ');
    const safeExample = escapeHtml(example).replace(/<br\s*\/?>/gi, ' ').replace(/\n/g, ' ');

    const inputId = `dict_${currentPage}_${idx}_${Math.random().toString(36).slice(2, 7)}`;

    html += `
      <div class="word-card" data-idx="${idx}">
        <div class="word-en" data-word="${safeEn}" title="点击查看释义">
          <span class="en-line">
            <span>${safeEn}</span>
            <span class="speaker-icon" data-speak="${safeEn}">🔊</span>
          </span>
          ${safePhonetic ? `<span class="word-phonetic">${safePhonetic}</span>` : ''}
        </div>
        <div class="word-meaning">
          ${safeMeaning}
          ${safeExample ? `<span class="word-example">例：${safeExample}</span>` : ''}
        </div>
        <div class="dictation-area">
          <input type="text" id="${inputId}" class="dictation-input" placeholder="默写..."
                 autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                 data-expected="${safeEn}" />
        </div>
        <button class="remove-btn" data-remove="${safeEn}" title="移除这个单词">✕</button>
      </div>
    `;
  });

  wordListEl.innerHTML = html;

  // 点击单词: 发音图标 → 只发音; 其它区域 → 弹窗
  document.querySelectorAll('.word-en').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.classList.contains('speaker-icon')) {
        e.stopPropagation();
        speakWord(e.target.dataset.speak);
        return;
      }
      const en = el.dataset.word;
      const w = pageWords.find(p => (p.en || p.英文) === en);
      if (w) openModal(w);
    });
  });

  // 默写校验
  document.querySelectorAll('.dictation-input').forEach(input => {
    input.addEventListener('input', () => {
      const v = input.value.trim();
      input.classList.remove('correct', 'wrong');
      if (!v) return;
      if (v.toLowerCase() === (input.dataset.expected || '').toLowerCase()) {
        input.classList.add('correct');
      } else {
        input.classList.add('wrong');
      }
    });
  });

  // 移除
  document.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const en = btn.dataset.remove;
      const key = wordKey(en);
      if (!key) return;
      if (!confirm(`确定移除 "${en}" 吗？\n（刷新后仍不会再显示）`)) return;
      removedSet.add(key);
      saveRemoved();
      rebuildOrderedWords();
      if (currentPage > getTotalPages()) currentPage = getTotalPages();
      renderPage();
    });
  });

  updatePagination();
}

function refresh(keepPage = false) {
  if (!keepPage) currentPage = 1;
  else {
    const t = getTotalPages();
    if (currentPage > t) currentPage = t;
    if (currentPage < 1) currentPage = 1;
  }
  renderPage();
}

function updateOrderButtonText() {
  orderBtn.textContent = isSequential ? '正序' : '乱序';
}

// ==================== 事件 ====================
pageSizeSelect.addEventListener('change', (e) => {
  pageSize = parseInt(e.target.value, 10);
  const t = Math.ceil(orderedWords.length / pageSize);
  if (currentPage > t) currentPage = t || 1;
  refresh(true);
});

orderBtn.addEventListener('click', () => {
  isSequential = !isSequential;
  updateOrderButtonText();
  rebuildOrderedWords();
  currentPage = 1;
  refresh(false);
});

prevBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderPage(); } });
nextBtn.addEventListener('click', () => {
  if (currentPage < getTotalPages()) { currentPage++; renderPage(); }
});

// ==================== 加载数据 ====================
async function loadWords() {
  try {
    const res = await fetch('./data/words.json?v=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('JSON 格式错误，应为数组');
    rawWords = data;
    loadRemoved();
    rebuildOrderedWords();
    updateOrderButtonText();
    refresh(false);
    console.log(`✅ 加载 ${rawWords.length} 个单词，已移除 ${removedSet.size} 个`);
  } catch (err) {
    console.error(err);
    wordListEl.innerHTML = `
      <div class="empty-state">
        ⚠️ 单词数据加载失败<br>
        <small style="color:#b32b2b;">${escapeHtml(err.message)}</small><br><br>
        请检查 <code>data/words.json</code> 是否存在。
      </div>`;
    statsDisplay.textContent = '加载失败';
  }
}

loadWords();
</script>
</body>
</html>
